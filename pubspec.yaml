name: nutrisync
description: "An AI-powered app for personalized nutrition."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  firebase_crashlytics: ^5.4.1
  cloud_firestore: ^6.10.2
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.0+2
  cupertino_icons: ^1.0.2
  http: ^1.2.0
  dio: ^5.4.3
  logging: ^1.2.0
  permission_handler: ^13.0.2
  speech_to_text: ^7.0.0
  just_audio: ^0.10.6
  geolocator: ^14.0.2
  google_maps_webservice: ^0.0.20-nullsafety.5
  google_maps_flutter: ^2.6.1
  url_launcher: ^6.2.2
  # Voice-First AI Agent dependencies
  record: ^6.0.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  flutter_local_notifications: ^18.0.1
  device_calendar: ^4.3.2
  # Email service
  mailer: ^7.3.0
  # JSON serialization
  json_annotation: ^4.8.1
  # Cryptography
  crypto: ^3.0.3
  # Secure on-device storage (uses Keychain/EncryptedSharedPreferences)
  flutter_secure_storage: ^10.3.4
  # P2 — UX
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^7.3.1
  # P6 — Food Vision camera picker
  image_picker: ^1.1.2
  # P4 — Monetization
  purchases_flutter: ^11.0.4
  # P5 — Performance
  firebase_performance: ^0.11.7
  cached_network_image: ^3.3.1

dependency_overrides:
  # Fix record_linux compatibility issue for Android builds
  record_linux: ^1.2.0
  # google_maps_webservice requires http ^0.13 but we use ^1.x — override forces http 1.x
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.1.1
  # Testing dependencies
  mockito: ^5.4.4
  build_runner: ^2.4.9
  # JSON serialization
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter
  test: ^1.24.9

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/nutrisync_icon.jpg"

flutter:
  uses-material-design: true

  # --- App Assets ---
  assets:
    - assets/images/nutrisync_icon.jpg
    - assets/images/google_logo.png
    - assets/images/apple_logo.png
    - assets/config/environments/
    # NOTE: assets/config/secure/ is intentionally NOT bundled.
    # API keys must be injected via --dart-define at build time or
    # fetched at runtime from Firebase Remote Config, then stored
    # in flutter_secure_storage. Never put real keys in assets/.

  # --- Custom Fonts ---
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
